name: Workflow driver

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node --check crates/celld/js/harness.js
      - run: node --test tests/workflow-recovery.test.mjs

  host-budget:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build the native runtime
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo build --release --locked -p celld
      - name: Install the dev bundler
        run: npm install --global esbuild@0.28.2
      - name: Exercise the host timeout and resident replay
        env:
          CELLD_BIN: ${{ github.workspace }}/target/release/celld
        run: node --test tests/workflow-host-budget.test.mjs
